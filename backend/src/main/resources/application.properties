spring.application.name=prontuarios
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8080/realms/Telemedicina-Realm}

app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}
app.server-key-file=${SERVER_KEY_FILE:keys/servidor-ec-p256.jwk}

app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8080}
app.keycloak.realm=Telemedicina-Realm
app.keycloak.admin-client-id=prontuarios-server
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:prontuarios-server-secret}
app.keycloak.public-key-attribute=chave_publica
